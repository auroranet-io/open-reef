services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openreef
      POSTGRES_PASSWORD: openreef
      POSTGRES_DB: openreef
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreef -d openreef"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
